<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetFriendly</title>
    <link rel="stylesheet" href="../../constants.css" />
    <link rel="stylesheet" href="../../main.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/settings.css" />
    <link rel="stylesheet" href="./css/sheetSettings.css" />
    <link rel="stylesheet" href="./css/monthSelection.css" />
    <link rel="stylesheet" href="./css/daySelection.css" />
    <link rel="stylesheet" href="./css/summary.css" />
    <link rel="stylesheet" href="./css/sheet.css" />
  </head>
  <body class="flex flex-down margin-zero">
    <header class="grid header align-items-center">
      <button id="exit" class="back-button no-select" href="../home/home.html" draggable="false">
        &larr;
      </button>
      <button class="header-title no-select custom-button open-settings-button">Title</button>
    </header>

    <dialog id="settings" class="modal padding-zero">
      <header class="modal-header grid">
        <button class="modal-back-button back-button no-select">X</button>
        <h1 class="modal-title">Settings</h1>
      </header>
      <div class="grid modal-body">
        <div class="flex flex-down">
          <h2 class="card description header">Budget Sheet Details</h2>
          <div class="change-title flex justify-content-between">
            <label class="description">Change Budget Sheet Title</label>
            <input
              type="text"
              class="new-title custom-input"
              maxlength="30"
              placeholder="Budget Sheet Title"
            />
          </div>
          <div class="option flex justify-content-between">
            <label class="description">Budgeting Period</label>
            <p id="budgetPeriod"></p>
          </div>
          <div class="option flex justify-content-between">
            <label class="description">Budget Amount</label>
            <p id="budget"></p>
          </div>
        </div>
        <div class="edit-categories flex">
          <div id="categories-header-bg" class="card description header add-category-mode">
            <p id="categories-header">Add a Category</p>
            <div class="edit-tools grid">
              <button id="add-category" class="custom-button tool">+</button>
              <button id="edit-category-name" class="custom-button tool">✏️</button>
              <button id="remove-category" class="tool">🗑️</button>
            </div>
          </div>
          <div class="categories flex align-items-center justify-content-center">
            <input
              id="category-input"
              type="text"
              class="new-category custom-input"
              maxlength="15"
              placeholder="___________"
            />
          </div>
        </div>
      </div>
    </dialog>

    <main class="flex flex-down align-items-center">
      <div class="card flex align-items-center">
        <div class="card-header flex">
          <button id="left-arrow" class="custom-button flex justify-content-center no-select">
            ◀
          </button>
          <button class="custom-button title no-select"></button>
          <button id="right-arrow" class="custom-button flex justify-content-center no-select">
            ▶
          </button>
        </div>

        <div class="calendar flex justify-content-center">
          <div class="month-selection">
            <div class="calendar-month grid">
              <div id="0" class="month-cell no-select">
                <div class="month-name">Jan</div>
                <div class="month-expense"></div>
              </div>
              <div id="1" class="month-cell no-select">
                <div class="month-name">Feb</div>
                <div class="month-expense"></div>
              </div>
              <div id="2" class="month-cell no-select">
                <div class="month-name">Mar</div>
                <div class="month-expense"></div>
              </div>
              <div id="3" class="month-cell no-select">
                <div class="month-name">Apr</div>
                <div class="month-expense"></div>
              </div>
              <div id="4" class="month-cell no-select">
                <div class="month-name">May</div>
                <div class="month-expense"></div>
              </div>
              <div id="5" class="month-cell no-select">
                <div class="month-name">Jun</div>
                <div class="month-expense"></div>
              </div>
              <div id="6" class="month-cell no-select">
                <div class="month-name">Jul</div>
                <div class="month-expense"></div>
              </div>
              <div id="7" class="month-cell no-select">
                <div class="month-name">Aug</div>
                <div class="month-expense"></div>
              </div>
              <div id="8" class="month-cell no-select">
                <div class="month-name">Sep</div>
                <div class="month-expense"></div>
              </div>
              <div id="9" class="month-cell no-select">
                <div class="month-name">Oct</div>
                <div class="month-expense"></div>
              </div>
              <div id="10" class="month-cell no-select">
                <div class="month-name">Nov</div>
                <div class="month-expense"></div>
              </div>
              <div id="11" class="month-cell no-select">
                <div class="month-name">Dec</div>
                <div class="month-expense"></div>
              </div>
            </div>
          </div>

          <div class="day-selection display-none">
            <div class="calendar-header grid">
              <div class="day-name no-select">Sun</div>
              <div class="day-name no-select">Mon</div>
              <div class="day-name no-select">Tue</div>
              <div class="day-name no-select">Wed</div>
              <div class="day-name no-select">Thu</div>
              <div class="day-name no-select">Fri</div>
              <div class="day-name no-select">Sat</div>
            </div>

            <div id="days" class="calendar-body grid"></div>
          </div>
        </div>

        <div class="budget-sheet display-none">
          <div class="table-header grid">
            <div class="column-header">Name</div>
            <div class="column-header">Category</div>
            <div class="column-header">Cost $</div>
          </div>

          <div class="table">
            <div id="filled-table"></div>

            <div class="new-row grid">
              <input
                type="text"
                class="cell name-cell new custom-input"
                placeholder="Name of item(s)"
              />
              <select class="cell category-cell new">
                <option value="">Select Category</option>
              </select>
              <input type="number" class="cell cost-cell new custom-input" placeholder="123.45" />
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2 class="summary-header">Budget Summary</h2>
        <section class="summary">
          <section class="flex flex-down align-items-center justify-content-center">
            <h3 class="expenditures-header"></h3>
            <div class="flex summary-body">
              <div class="summation"></div>
              <div class="total-budget display-none"></div>
            </div>
          </section>
          <section class="flex flex-down align-items-center visual-summary">
            <h3 class="visual-summary-header">Category Expenditures</h3>
            <div class="flex pie-chart-info">
              <div class="pie-chart"></div>
              <div class="card legend justify-content-center"></div>
            </div>
          </section>
        </section>
      </div>
    </main>

    <script type="module" async src="./main.js"></script>
  </body>
</html>
