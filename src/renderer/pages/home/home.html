<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetFriendly</title>
    <link rel="stylesheet" href="../../constants.css" />
    <link rel="stylesheet" href="../../main.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="../../pages/budgeting/css/settings.css" />
    <link rel="stylesheet" href="./css/budgetSheetCreation.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/config.css" />
  </head>
  <body class="margin-zero">
    <header class="header flex position-fixed align-items-center justify-content-center">
      <button id="configButton" class="header-title custom-button no-select">BudgetFriendly</button>
    </header>

    <dialog id="config" class="modal">
      <header class="modal-header flex">
        <button id="closeConfig" class="modal-back-button close-modal no-select">X</button>
        <h1 class="modal-title">Configurations</h1>
      </header>
      <div class="modal-body">
        <section id="theme-config" class="grid custom-theme">
          <section id="createTheme" class="flex flex-down theme-creation text-align-center">
            <h3 class="card">Make a Theme</h3>
            <div class="grid">
              <div class="flex">
                <label>Background</label>
                <input
                  type="color"
                  id="colourPickerBackground"
                  class="colour-picker"
                  value="#e5f6ff"
                />
              </div>
              <div class="flex">
                <label>Primary</label>
                <input
                  type="color"
                  id="colourPickerPrimary"
                  class="colour-picker"
                  value="#ffd900"
                />
              </div>
              <div class="flex">
                <label>Secondary</label>
                <input
                  type="color"
                  id="colourPickerSecondary"
                  class="colour-picker"
                  value="#cceeff"
                />
              </div>
              <div class="flex">
                <label>Tertiary</label>
                <input
                  type="color"
                  id="colourPickerTertiary"
                  class="colour-picker"
                  value="#ffffff"
                />
              </div>
              <div class="flex">
                <label>Name</label>
                <input
                  id="themeNameInput"
                  type="text"
                  class="theme-name-input custom-input"
                  maxlength="15"
                  placeholder="name"
                  required
                />
              </div>
            </div>
            <button id="saveThemeButton" class="custom-button save-theme-but">Save</button>
          </section>
          <section id="selectTheme" class="flex flex-down theme-selection">
            <section class="select-originals text-align-center">
              <h3>Original Themes</h3>
              <div id="originalThemes" class="grid theme-list">
                <button id="000" class="flex custom-button theme" style="background-color: #e5f6ff">
                  <label style="color: black">Sunny Days</label>
                  <div class="grid display-colours">
                    <div style="background-color: #ffd900; border-color: black !important"></div>
                    <div style="background-color: #cceeff; border-color: black !important"></div>
                    <div style="background-color: #ffffff; border-color: black !important"></div>
                  </div>
                </button>
                <button id="001" class="flex custom-button theme" style="background-color: #bfbfbf">
                  <label style="color: black">Moonlight</label>
                  <div class="grid display-colours">
                    <div style="background-color: #808080; border-color: black !important"></div>
                    <div style="background-color: #e6e6e6; border-color: black !important"></div>
                    <div style="background-color: #ffffff; border-color: black !important"></div>
                  </div>
                </button>
                <button id="002" class="flex custom-button theme" style="background-color: #fee7f5">
                  <label style="color: black">Strawberry</label>
                  <div class="grid display-colours">
                    <div style="background-color: #ff337a; border-color: black !important"></div>
                    <div style="background-color: #ffcce7; border-color: black !important"></div>
                    <div style="background-color: #ffffff; border-color: black !important"></div>
                  </div>
                </button>
                <button id="003" class="flex custom-button theme" style="background-color: #0f0019">
                  <label style="color: white">Obsidian</label>
                  <div class="grid display-colours">
                    <div style="background-color: #2a0f3e; border-color: white !important"></div>
                    <div style="background-color: #6600cc; border-color: white !important"></div>
                    <div style="background-color: #d69afe; border-color: white !important"></div>
                  </div>
                </button>
                <button id="004" class="flex custom-button theme" style="background-color: #b3e4ff">
                  <label style="color: black">Ocean Waves</label>
                  <div class="grid display-colours">
                    <div style="background-color: #0062ff; border-color: black !important"></div>
                    <div style="background-color: #4dc3ff; border-color: black !important"></div>
                    <div style="background-color: #ccd2ff; border-color: black !important"></div>
                  </div>
                </button>
              </div>
            </section>
            <section class="select-customs text-align-center">
              <h3>Your Themes</h3>
              <div id="userThemes" class="grid theme-list"></div>
            </section>
          </section>
        </section>
      </div>
    </dialog>

    <main>
      <dialog id="settings" class="modal padding-zero">
        <header class="modal-header flex">
          <button class="modal-back-button back-button no-select">X</button>
          <h1 class="modal-title">Create Budget Sheet</h1>
          <button class="submit-button no-select">></button>
        </header>
        <div class="grid modal-body">
          <div class="flex flex-down">
            <h2 class="card description header text-align-center">Budget Sheet Details</h2>
            <div class="change-title flex align-items-center">
              <label class="description">Name of Budget Sheet</label>
              <input
                type="text"
                class="new-title custom-input"
                maxlength="30"
                placeholder="Budget Sheet Title"
              />
            </div>

            <div class="flex period-options">
              <label>Budget Period Selection</label>
              <select class="period-dropdown">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="biweekly">Biweekly</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
            <div class="flex amount">
              <label>Enter Budget Amount</label>
              <input class="budget-amount custom-input" type="number" placeholder="1234.56" />
            </div>
          </div>

          <div class="edit-categories flex">
            <div id="categories-header-bg" class="card description header add-category-mode align-items-center">
              <p id="categories-header">Add a Category</p>
              <div class="edit-tools grid">
                <button id="add-category" class="custom-button tool">+</button>
                <button id="edit-category-name" class="custom-button tool">✏️</button>
                <button id="remove-category" class="custom-button tool">🗑️</button>
              </div>
            </div>
            <div class="categories flex align-items-center justify-content-center">
              <input
                id="category-input"
                type="text"
                class="new-category custom-input"
                maxlength="15"
                placeholder="___________"
              />
            </div>
          </div>
        </div>
      </dialog>

      <div class="header-space"></div>

      <div class="budgets-page page flex" data-page="budgets">
        <button
          class="custom-button open-settings-button flex align-items-center justify-content-center no-select"
          ref="noreferrer"
          draggable="false"
        >
          +
        </button>
        <div class="grid budgets-list"></div>
      </div>
    </main>

    <script type="module" async src="../../main.js"></script>
    <script type="module" async src="./main.js"></script>
  </body>
</html>
